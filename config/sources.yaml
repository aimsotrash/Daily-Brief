# Daily-Brief source registry.
#
# Adding a source = adding an entry here. Nothing in the code knows about any
# specific publication. Remove or set `enabled: false` to drop one.
#
# ---------------------------------------------------------------------------
# ABOUT THE BIAS METADATA -- PLEASE READ
# ---------------------------------------------------------------------------
# `lean` is an ANALYTICAL CLASSIFICATION, not a fact. It is a coarse editorial
# prior describing where a publication's *news framing* has generally been placed
# by media-bias research (AllSides, Ad Fontes, Reuters Institute) and by the
# outlet's own stated positioning. It is:
#
#   * a prior, not a verdict -- the article-level analyser in
#     daily_brief/analysis/bias.py adjusts it per article using measurable text
#     signals, and can move an article well away from its source prior;
#   * about US/UK political framing, which is a poor fit for many outlets --
#     hence `confidence`, which the UI uses to hedge how strongly it presents it;
#   * contestable. `notes` records the reasoning so a user can disagree with it.
#
# lean: left | center-left | center | center-right | right | state-affiliated |
#       not-applicable
# confidence: low | medium | high   (how well the lean label fits this outlet)
# source_type: wire | newspaper | broadcaster | public-broadcaster |
#              digital-native | magazine | trade | aggregator | blog |
#              vendor | non-profit
# ---------------------------------------------------------------------------

methodology:
  version: 1
  scale: "left, center-left, center, center-right, right, state-affiliated, not-applicable"
  basis: >-
    Coarse priors informed by published media-bias ratings (AllSides,
    Ad Fontes Media), Reuters Institute Digital News Report trust/positioning
    data, and outlets' self-described editorial stance. Applied to news framing,
    not to factual accuracy -- an outlet with a strong lean can still be
    factually reliable, and a centrist outlet can still be wrong.
  disclaimer: >-
    These labels are analytical classifications produced for context, not
    statements of fact, and they describe the publication as a whole. Individual
    articles vary; Daily-Brief therefore analyses articles individually and shows
    the evidence behind each article-level assessment.

defaults:
  enabled: true
  lean: unknown
  confidence: low
  source_type: digital-native
  country: US

